name: Daily data refresh

# Collects live data, rebuilds the database and analysis reports against a
# throwaway local Postgres service (fast, no network round trips), publishes the
# result to Neon in a single dump/restore, then ships a new backend image and
# redeploys it to Render.
#
# Required repository secrets:
#   NEON_DATABASE_URL         Neon connection string (the app's DATABASE_URL)
#   FOOTBALL_CHARTS_API_KEY   Upstream Football Charts API key
#   DOCKERHUB_USERNAME        Docker Hub account that owns the image
#   DOCKERHUB_TOKEN           Docker Hub access token (read/write)
#   RENDER_DEPLOY_HOOK        Render deploy hook URL for the backend service
#
# The Render service must be configured to deploy
# `<DOCKERHUB_USERNAME>/football_data_analysis:latest`.

on:
  schedule:
    # 18:00 UTC = 01:00 Asia/Bangkok (UTC+7)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if a successful run is already stamped for today
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: football_data_analysis
  PG_IMAGE: postgres:16
  # Ephemeral build database. The pipeline never talks to Neon until the
  # publish step, so a slow/failed rebuild cannot corrupt production.
  LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/football

jobs:
  refresh:
    name: Refresh data, rebuild image, redeploy
    runs-on: ubuntu-latest
    # The local rebuild took ~39 min in a full sweep; leave room for slow API days.
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pg_isready is used by refresh_data.sh's preflight.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Write .env for the pipeline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          FOOTBALL_CHARTS_API_KEY: ${{ secrets.FOOTBALL_CHARTS_API_KEY }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ] || [ -z "$FOOTBALL_CHARTS_API_KEY" ]; then
            echo "::error::Missing NEON_DATABASE_URL or FOOTBALL_CHARTS_API_KEY secret"
            exit 1
          fi
          # Strip stray CR/LF and surrounding spaces pasted into the secret UI.
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          umask 077
          {
            # The ETL/analysis stages build the throwaway local database.
            printf 'DATABASE_URL=%s\n' "$(clean "$LOCAL_DATABASE_URL")"
            printf 'FOOTBALL_CHARTS_API_KEY=%s\n' "$(clean "$FOOTBALL_CHARTS_API_KEY")"
          } > .env

      - name: Preflight upstream API key
        env:
          FOOTBALL_CHARTS_API_KEY: ${{ secrets.FOOTBALL_CHARTS_API_KEY }}
        run: |
          # Fail in seconds instead of after a ~50 min sweep if the key is wrong.
          code="$(curl -sS -o "$RUNNER_TEMP/leagues.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${FOOTBALL_CHARTS_API_KEY//[$'\r\n']/}" \
            https://footballcharts-backend.onrender.com/api/v1/leagues/ || true)"
          echo "Upstream /leagues/ responded HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Upstream API key rejected (HTTP $code). Re-set the FOOTBALL_CHARTS_API_KEY secret to the raw key (no quotes, no whitespace)."
            exit 1
          fi

      - name: Backup Neon before publishing
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          # The publish step drops and reloads every table, so keep a
          # recoverable copy in case it fails halfway through.
          DIRECT_DATABASE_URL="${DATABASE_URL/-pooler./.}"
          DATABASE_URL="$DIRECT_DATABASE_URL" \
            python backend/scripts/compare_row_counts.py --snapshot "$RUNNER_TEMP/neon-before-counts.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e PGCONN="$DIRECT_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --schema=public --no-owner --no-privileges --file=/backup/neon-before.dump "$PGCONN"'
          ls -lh "$RUNNER_TEMP/neon-before.dump"

      - name: Upload Neon pre-publish backup
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neon-before-dump
          path: |
            ${{ runner.temp }}/neon-before.dump
            ${{ runner.temp }}/neon-before-counts.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Refresh data
        id: refresh
        continue-on-error: true
        # Shorter than the job timeout so a hung run fails this step and still
        # lets the inspect/publish/restore steps below execute.
        timeout-minutes: 120
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          PYTHON: python3
        run: |
          args=()
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          bash scripts/refresh_data.sh "${args[@]}"

      - name: Verify every refresh stage succeeded
        id: verify
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path("logs/refresh_summary.json")
          expected = 7
          ready = False
          if summary.exists():
              data = json.loads(summary.read_text(encoding="utf-8"))
              stages = data.get("stages", [])
              failed = [s["name"] for s in stages if s.get("result") != "ok"]
              if failed:
                  print("::error::Failed stages: " + ", ".join(failed))
              elif len(stages) < expected:
                  print(f"::error::Only {len(stages)} of {expected} stages recorded")
              else:
                  ready = True
                  print(f"All {len(stages)} stages succeeded: " + ", ".join(s["name"] for s in stages))
          else:
              print("::error::No refresh_summary.json; refusing to publish or deploy")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ready={'true' if ready else 'false'}\n")
          PY

          if [ "${{ steps.refresh.outcome }}" = "failure" ] && [ "$ready" = "false" ]; then
            echo "::error::Refresh itself failed and not every stage reported success."
          fi

          log="logs/refresh_latest.log"
          if [ -f "$log" ]; then
            grep -m 5 -E 'ERROR|Traceback|HTTP 4[0-9][0-9]' "$log" || true
          fi

      - name: Upload refresh log
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-log
          path: |
            logs/refresh_latest.log
            logs/refresh_summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish rebuilt database to Neon
        id: publish
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          NEON_DATABASE_URL="$(printf '%s' "$NEON_DATABASE_URL" | tr -d '\r\n')"
          # Dump the fast local build once, then replace Neon's public schema
          # with it. --network host reaches the local Postgres service.
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e PGCONN="$LOCAL_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --schema=public --no-owner --no-privileges --file=/backup/local-after.dump "$PGCONN"'
          ls -lh "$RUNNER_TEMP/local-after.dump"

          # 00_reset.sql clears the old tables; the schema entry is filtered out
          # of the TOC so it cannot collide with the existing public schema.
          DIRECT_DATABASE_URL="${NEON_DATABASE_URL/-pooler./.}"
          docker run --rm --network host \
            -e PGCONN="$DIRECT_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            -v "$GITHUB_WORKSPACE/sql":/sql:ro \
            "$PG_IMAGE" \
            sh -c '
              psql "$PGCONN" -v ON_ERROR_STOP=1 -f /sql/00_reset.sql &&
              pg_restore -l /backup/local-after.dump \
                | grep -v -E "^[0-9]+; [0-9]+ [0-9]+ SCHEMA - public " \
                | grep -v -E " COMMENT - SCHEMA public " \
                > /tmp/restore.list &&
              pg_restore --dbname="$PGCONN" --no-owner --no-privileges --exit-on-error \
                --use-list=/tmp/restore.list /backup/local-after.dump
            '
          DATABASE_URL="$DIRECT_DATABASE_URL" \
            python backend/scripts/compare_row_counts.py \
              --snapshot "$RUNNER_TEMP/neon-after-counts.json"
          DATABASE_URL="$DIRECT_DATABASE_URL" \
            python backend/scripts/compare_row_counts.py \
              --before "$RUNNER_TEMP/neon-before-counts.json" \
              --after "$RUNNER_TEMP/neon-after-counts.json"

      - name: Restore Neon after a failed publish
        if: ${{ !cancelled() && steps.publish.outcome == 'failure' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          # 00_reset.sql clears whatever the partial publish left behind; the
          # schema entry is filtered out of the TOC so it cannot collide with
          # the existing public schema.
          DIRECT_DATABASE_URL="${DATABASE_URL/-pooler./.}"
          docker run --rm --network host \
            -e PGCONN="$DIRECT_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            -v "$GITHUB_WORKSPACE/sql":/sql:ro \
            "$PG_IMAGE" \
            sh -c '
              psql "$PGCONN" -v ON_ERROR_STOP=1 -f /sql/00_reset.sql &&
              pg_restore -l /backup/neon-before.dump \
                | grep -v -E "^[0-9]+; [0-9]+ [0-9]+ SCHEMA - public " \
                | grep -v -E " COMMENT - SCHEMA public " \
                > /tmp/restore.list &&
              pg_restore --dbname="$PGCONN" --no-owner --no-privileges --exit-on-error \
                --use-list=/tmp/restore.list /backup/neon-before.dump
            '

      - name: Fail when the rebuild or Neon publish failed
        if: ${{ !cancelled() && (steps.verify.outputs.ready != 'true' || steps.publish.outcome == 'failure') }}
        run: |
          echo "::error::Aborting: the database was not rebuilt and published to Neon successfully."
          exit 1

      - name: Compute image tag
        id: tag
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' && steps.publish.outcome == 'success' }}
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Ensure build-context directories exist
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' && steps.publish.outcome == 'success' }}
        run: mkdir -p data/raw/fixtures data/analysis

      - name: Check build artifacts
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' && steps.publish.outcome == 'success' }}
        run: bash scripts/check_build_artifacts.sh

      - name: Log in to Docker Hub
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' && steps.publish.outcome == 'success' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Remember the running backend image
        id: previous
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' && steps.publish.outcome == 'success' }}
        continue-on-error: true
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
          if docker pull "$image:latest"; then
            docker tag "$image:latest" "$image:previous"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous latest image; rollback will not be possible."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' && steps.publish.outcome == 'success' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Render deploy
        id: deploy
        if: ${{ !cancelled() && steps.verify.outputs.ready == 'true' && steps.publish.outcome == 'success' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK secret"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Wait for the backend health check
        id: health
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: |
          sleep 30
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 https://football-data-analysis-latest.onrender.com/health; then
              echo "backend healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Backend did not become healthy after deploy"
          exit 1

      - name: Roll back the previous backend image
        if: ${{ steps.health.outcome == 'failure' && steps.previous.outputs.available == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK secret; cannot roll back"
            exit 1
          fi
          image="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
          docker tag "$image:previous" "$image:latest"
          docker push "$image:latest"
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 https://football-data-analysis-latest.onrender.com/health; then
              echo "backend healthy again after rollback"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Backend still unhealthy after rollback"
          exit 1

      - name: Fail when the backend is unhealthy
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure' }}
        run: |
          echo "::error::Backend health check failed; deployment was not verified."
          exit 1
