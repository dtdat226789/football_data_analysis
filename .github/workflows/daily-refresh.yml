name: Daily data refresh

# Collects live data, rebuilds the database and analysis reports against a
# throwaway local Postgres service (fast, no network round trips), publishes the
# result to Neon in a single dump/restore, then ships a new backend image and
# redeploys it to Render.
#
# Required repository secrets:
#   NEON_DATABASE_URL         Neon connection string (the app's DATABASE_URL)
#   FOOTBALL_CHARTS_API_KEY   Upstream Football Charts API key
#   DOCKERHUB_USERNAME        Docker Hub account that owns the image
#   DOCKERHUB_TOKEN           Docker Hub access token (read/write)
#   RENDER_DEPLOY_HOOK        Render deploy hook URL for the backend service
#
# The Render service must be configured to deploy
# `<DOCKERHUB_USERNAME>/football_data_analysis:latest`.

on:
  schedule:
    # 18:00 UTC = 01:00 Asia/Bangkok (UTC+7)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if a successful run is already stamped for today
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: football_data_analysis
  PG_IMAGE: postgres:18
  # Ephemeral build database. The pipeline never talks to Neon until the
  # publish step, so a slow/failed rebuild cannot corrupt production.
  LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/football

jobs:
  refresh:
    name: Refresh data, rebuild image, redeploy
    runs-on: ubuntu-latest
    # The local rebuild took ~39 min in a full sweep; leave room for slow API days.
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pg_isready is used by refresh_data.sh's preflight.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Write .env for the pipeline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          FOOTBALL_CHARTS_API_KEY: ${{ secrets.FOOTBALL_CHARTS_API_KEY }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ] || [ -z "$FOOTBALL_CHARTS_API_KEY" ]; then
            echo "::error::Missing NEON_DATABASE_URL or FOOTBALL_CHARTS_API_KEY secret"
            exit 1
          fi
          # Strip stray CR/LF and surrounding spaces pasted into the secret UI.
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          umask 077
          {
            # The ETL/analysis stages build the throwaway local database.
            printf 'DATABASE_URL=%s\n' "$(clean "$LOCAL_DATABASE_URL")"
            printf 'FOOTBALL_CHARTS_API_KEY=%s\n' "$(clean "$FOOTBALL_CHARTS_API_KEY")"
          } > .env

      - name: Preflight upstream API key
        env:
          FOOTBALL_CHARTS_API_KEY: ${{ secrets.FOOTBALL_CHARTS_API_KEY }}
        run: |
          # Fail in seconds instead of after a ~50 min sweep if the key is wrong.
          code="$(curl -sS -o "$RUNNER_TEMP/leagues.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${FOOTBALL_CHARTS_API_KEY//[$'\r\n']/}" \
            https://footballcharts-backend.onrender.com/api/v1/leagues/ || true)"
          echo "Upstream /leagues/ responded HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Upstream API key rejected (HTTP $code). Re-set the FOOTBALL_CHARTS_API_KEY secret to the raw key (no quotes, no whitespace)."
            exit 1
          fi

      - name: Backup Neon before publishing
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          # The publish step drops and reloads every table, so keep a
          # recoverable copy in case it fails halfway through.
          DIRECT_DATABASE_URL="${DATABASE_URL/-pooler./.}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e PGCONN="$DIRECT_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --schema=public --no-owner --no-privileges --file=/backup/neon-before.dump "$PGCONN"'
          ls -lh "$RUNNER_TEMP/neon-before.dump"

      - name: Upload Neon pre-publish backup
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: neon-before-dump
          path: ${{ runner.temp }}/neon-before.dump
          if-no-files-found: ignore
          retention-days: 7

      - name: Refresh data
        id: refresh
        continue-on-error: true
        # Shorter than the job timeout so a hung run fails this step and still
        # lets the inspect/publish/restore steps below execute.
        timeout-minutes: 120
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          PYTHON: python3
        run: |
          args=()
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          bash scripts/refresh_data.sh "${args[@]}"

      - name: Inspect the database stage result
        id: verify
        if: ${{ !cancelled() }}
        run: |
          log="logs/refresh_latest.log"
          line=""
          if [ -f "$log" ]; then
            line="$(grep -F '| build database + analysis (all leagues) |' "$log" | tail -1 || true)"
          fi

          if printf '%s' "$line" | grep -q '| ok |'; then
            echo "db_ok=true" >> "$GITHUB_OUTPUT"
            echo "Database + analysis stage succeeded."
          else
            echo "db_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Database + analysis stage did not succeed; refusing to publish or deploy."
          fi

          if [ "${{ steps.refresh.outcome }}" = "failure" ] \
             && printf '%s' "$line" | grep -q '| ok |'; then
            echo "::warning::Refresh exited non-zero but the database rebuild succeeded; publishing the fresh data anyway."
          fi

          # Surface the first real errors so the run page shows the cause.
          if [ -f "$log" ]; then
            grep -m 5 -E 'ERROR|Traceback|HTTP 4[0-9][0-9]' "$log" || true
          fi

      - name: Upload refresh log
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: logs/refresh_latest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish rebuilt database to Neon
        id: publish
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' }}
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          NEON_DATABASE_URL="$(printf '%s' "$NEON_DATABASE_URL" | tr -d '\r\n')"
          # Dump the fast local build once, then replace Neon's public schema
          # with it. --network host reaches the local Postgres service.
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e PGCONN="$LOCAL_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --schema=public --no-owner --no-privileges --file=/backup/local-after.dump "$PGCONN"'
          ls -lh "$RUNNER_TEMP/local-after.dump"

          # 00_reset.sql clears the old tables; the schema entry is filtered out
          # of the TOC so it cannot collide with the existing public schema.
          DIRECT_DATABASE_URL="${NEON_DATABASE_URL/-pooler./.}"
          docker run --rm --network host \
            -e PGCONN="$DIRECT_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            -v "$GITHUB_WORKSPACE/sql":/sql:ro \
            "$PG_IMAGE" \
            sh -c '
              psql "$PGCONN" -v ON_ERROR_STOP=1 -f /sql/00_reset.sql &&
              pg_restore -l /backup/local-after.dump \
                | grep -v -E "^[0-9]+; [0-9]+ [0-9]+ SCHEMA - public " \
                | grep -v -E " COMMENT - SCHEMA public " \
                > /tmp/restore.list &&
              pg_restore --dbname="$PGCONN" --no-owner --no-privileges --exit-on-error \
                --use-list=/tmp/restore.list /backup/local-after.dump
            '

      - name: Restore Neon after a failed publish
        if: ${{ !cancelled() && steps.publish.outcome == 'failure' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          # 00_reset.sql clears whatever the partial publish left behind; the
          # schema entry is filtered out of the TOC so it cannot collide with
          # the existing public schema.
          DIRECT_DATABASE_URL="${DATABASE_URL/-pooler./.}"
          docker run --rm --network host \
            -e PGCONN="$DIRECT_DATABASE_URL" \
            -v "$RUNNER_TEMP":/backup \
            -v "$GITHUB_WORKSPACE/sql":/sql:ro \
            "$PG_IMAGE" \
            sh -c '
              psql "$PGCONN" -v ON_ERROR_STOP=1 -f /sql/00_reset.sql &&
              pg_restore -l /backup/neon-before.dump \
                | grep -v -E "^[0-9]+; [0-9]+ [0-9]+ SCHEMA - public " \
                | grep -v -E " COMMENT - SCHEMA public " \
                > /tmp/restore.list &&
              pg_restore --dbname="$PGCONN" --no-owner --no-privileges --exit-on-error \
                --use-list=/tmp/restore.list /backup/neon-before.dump
            '

      - name: Fail when the rebuild or Neon publish failed
        if: ${{ !cancelled() && (steps.verify.outputs.db_ok != 'true' || steps.publish.outcome == 'failure') }}
        run: |
          echo "::error::Aborting: the database was not rebuilt and published to Neon successfully."
          exit 1

      - name: Compute image tag
        id: tag
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' && steps.publish.outcome == 'success' }}
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Ensure build-context directories exist
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' && steps.publish.outcome == 'success' }}
        run: mkdir -p data/raw/fixtures data/analysis

      - name: Log in to Docker Hub
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' && steps.publish.outcome == 'success' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' && steps.publish.outcome == 'success' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Render deploy
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' && steps.publish.outcome == 'success' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK secret"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"