name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "backend/requirements-api.txt"
      - "ml/**"
      - "sql/**"
      - "scripts/generate_ml_artifacts.sh"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: football_data_analysis
  LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/football

jobs:
  deploy:
    name: Build image with ML artifacts and redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/football
      FOOTBALL_CHARTS_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.10

      - name: Lint
        run: ruff check .

      - name: Build database from committed sample data
        run: python backend/scripts/build_database.py

      - name: Generate ML artifacts
        run: bash scripts/generate_ml_artifacts.sh

      - name: Test
        run: python -m pytest -q

      - name: Verify the predictions artifact is in the build context
        run: |
          test -s ml/datasets/match_predictions.json
          python -c "import json; p=json.load(open('ml/datasets/match_predictions.json')); assert p['matches'] and p['model_id']"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Remember the running backend image
        id: previous
        continue-on-error: true
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
          if docker pull "$image:latest"; then
            docker tag "$image:latest" "$image:previous"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous latest image; rollback will not be possible."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tag
        id: tag
        run: echo "date=$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Ensure build-context directories exist
        run: mkdir -p data/raw/fixtures data/analysis

      - name: Check upstream API key
        env:
          FOOTBALL_CHARTS_API_KEY: ${{ secrets.FOOTBALL_CHARTS_API_KEY }}
        run: |
          key="$(printf '%s' "$FOOTBALL_CHARTS_API_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$key" ]; then
            echo "::error::Missing FOOTBALL_CHARTS_API_KEY secret"
            exit 1
          fi
          code="$(curl -sS -o "$RUNNER_TEMP/leagues.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${key}" \
            https://footballcharts-backend.onrender.com/api/v1/leagues/ || true)"
          echo "Upstream /leagues/ responded HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Upstream API key rejected (HTTP $code). Re-set the FOOTBALL_CHARTS_API_KEY secret to the raw key."
            exit 1
          fi

      - name: Collect upcoming fixtures
        env:
          FOOTBALL_CHARTS_API_KEY: ${{ secrets.FOOTBALL_CHARTS_API_KEY }}
        run: |
          export FOOTBALL_CHARTS_API_KEY="$(printf '%s' "$FOOTBALL_CHARTS_API_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          python backend/scripts/fetch_fixtures.py --overwrite
          python backend/scripts/fetch_fixture_details.py --overwrite

      - name: Verify fixtures are in the build context
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/raw/fixtures")
          files = [p for p in root.glob("*.json") if p.name != "manifest.json"]
          if not files:
              raise SystemExit("No fixture files were collected; refusing to build an empty fixtures image.")
          manifest = json.loads((root / "manifest.json").read_text())
          failed = manifest.get("failed") or []
          if failed:
              raise SystemExit(f"Fixture fetch failed for {len(failed)} league(s): {failed[:5]}")
          rows = sum(len(json.loads(p.read_text()).get("matches") or []) for p in files)
          if rows == 0:
              raise SystemExit("Fixture files contain no matches; refusing to build.")
          print(f"fixtures: {len(files)} leagues, {rows} matches")
          PY

      - name: Check build artifacts
        run: bash scripts/check_build_artifacts.sh

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK secret"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Wait for the backend health check
        id: health
        continue-on-error: true
        run: |
          sleep 30
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 https://football-data-analysis-latest.onrender.com/health; then
              echo "backend healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Backend did not become healthy after deploy"
          exit 1

      - name: Roll back the previous backend image
        if: ${{ steps.health.outcome == 'failure' && steps.previous.outputs.available == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK secret; cannot roll back"
            exit 1
          fi
          image="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
          docker tag "$image:previous" "$image:latest"
          docker push "$image:latest"
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 https://football-data-analysis-latest.onrender.com/health; then
              echo "backend healthy again after rollback"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Backend still unhealthy after rollback"
          exit 1

      - name: Fail when the backend is unhealthy
        if: ${{ !cancelled() && steps.health.outcome == 'failure' }}
        run: |
          echo "::error::Backend health check failed; deployment was not verified."
          exit 1
