name: Deploy web

# Ships frontend/worker changes to Cloudflare without waiting for the daily data
# refresh. Backend changes deploy independently via deploy-backend.yml; this one
# only publishes the static app and its API proxy worker.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   Token with Workers Scripts:Edit and Workers Routes:Edit
#   CLOUDFLARE_ACCOUNT_ID  Account that owns the football-web worker

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Vitest 5 and jsdom 31 require Node 22.22+/24.15+.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          fi

      - name: Test worker
        run: npm test --prefix worker

      - name: Verify BACKEND_SHARED_SECRET is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Deploying without the secret makes every proxied /api/* call 403
          # once the Render origin enforces WORKER_SHARED_SECRET.
          secrets="$(npx --yes wrangler@4.165.0 secret list --name football-web)"
          if ! printf '%s\n' "$secrets" | grep -q BACKEND_SHARED_SECRET; then
            echo "::error::Worker secret BACKEND_SHARED_SECRET is missing. Set it with: npx wrangler@4.165.0 secret put BACKEND_SHARED_SECRET --name football-web"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy worker and assets
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Rate-limit bindings require Wrangler >= 4.36; pin the exact CLI so
          # local dry runs and CI deploy the same bundle.
          wranglerVersion: "4.165.0"
          command: deploy
