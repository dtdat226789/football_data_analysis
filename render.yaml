services:
  - type: web
    name: football-data-analysis
    runtime: image
    plan: free
    image:
      url: docker.io/REPLACE_WITH_DOCKERHUB_USERNAME/football_data_analysis:latest
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: ALLOW_INSECURE_API
        value: "0"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "120"
